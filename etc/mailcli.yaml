# mailcli configuration
# Config file: etc/mailcli.yaml
# Generated:   2026-06-02 09:12:30
debug: false # verbose debug logging
# IMAP settings for reading mail (imap command)
imap:
    download-dir: . # directory to save attachments
    inbox: INBOX # default mailbox name
    insecure: false # skip TLS certificate verification
    password: "" # authentication password
    port: 143 # port: 143=plain, 993=IMAPS (ssl)
    server: "" # hostname or IP of the IMAP server
    ssl: false # use implicit TLS / IMAPS
    timeout: 0 # connection timeout in seconds
    tls: false # use STARTTLS
    username: "" # authentication username
info: false # enable info-level logging
no-color: false # disable coloured log output
# default settings for the sign command
sign:
    body: "" # content to sign
    cert-chain: "" # comma-separated cert chain PEM files (S/MIME)
    include-chain: false # include cert chain in S/MIME signature
    method: "" # signing method: rsa, ecdsa, gpg, smime
    passphrase: "" # key passphrase
    private-key: "" # private key or S/MIME bundle PEM file
    public-key: "" # public key or certificate file
# SMTP settings for outgoing mail (send command)
smtp:
    attach: "" # default attachment file(s), comma-separated
    auth: "" # auth method: plain, login, crammd5, xoauth2
    bcc: [] # default BCC recipient(s)
    body: "" # default body text
    cc: [] # default CC recipient(s)
    from: "" # default sender address
    helo: "" # custom HELO/EHLO hostname
    html: false # send body as text/html
    insecure: false # skip TLS certificate verification
    max-size: 0 # max attachment size in bytes (0 = 5 MB default)
    password: "" # authentication password
    port: 25 # port: 25=plain, 465=SMTPS (ssl), 587=STARTTLS (tls)
    server: "" # hostname or IP of the SMTP server
    # outgoing mail signing
    sign:
        cert-chain: "" # comma-separated cert chain PEM files (S/MIME)
        include-chain: false # include cert chain in S/MIME signature
        method: "" # signing method: rsa, ecdsa, gpg, smime
        passphrase: "" # key passphrase
        private-key: "" # private key or S/MIME bundle PEM file
        public-key: "" # public key or certificate file
    ssl: false # use implicit TLS / SMTPS
    subject: "" # default subject line
    timeout: 0 # connection timeout in seconds (0 = 15s default)
    tls: false # use STARTTLS
    to: [] # default recipient(s)
    username: "" # authentication username
# default settings for the verify command
verify:
    body: "" # content to verify
    method: "" # signing method: rsa, ecdsa, gpg, smime
    passphrase: "" # key passphrase
    private-key: "" # private key or S/MIME bundle fallback
    public-key: "" # public key or certificate file
    signature: "" # base64-encoded signature
